# Single-host local HTTP. Compose peers and configured routes are inside the
# plaintext trust boundary; loopback publication alone does not prove isolation.
# Advanced TLS uses the explicit startup override, never automatic fallback.
name: foundry

services:
  router:
    image: ${FOUNDRY_ROUTER_IMAGE:-foundry-sr-mi:5bd4fa4-local}
    build:
      context: .
      dockerfile: Dockerfile.mi
    command:
      - --host=0.0.0.0
      - --port=8787
      - --data-dir=/data
      - --local-container-http
      - --worker-listen-host=0.0.0.0
      - --worker-listen-port=8790
    environment:
      SR_HEALTHCHECK_URL: http://127.0.0.1:8787/healthz
    ports:
      - "127.0.0.1:${FOUNDRY_ROUTER_PORT:-8787}:8787"
      - "127.0.0.1:${FOUNDRY_WORKER_PORT:-8790}:8790"
    volumes:
      - router-data:/data
    networks:
      - backend
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true

networks:
  backend: {}

volumes:
  router-data: {}
